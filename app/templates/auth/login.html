{% extends "base.html" %}
{% block title %}Connexion - Sentinelle{% endblock %}

{% block login_content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Sentinelle" class="login-logo mb-2">
            <h3 class="fw-bold">Sentinelle</h3>
            <p class="text-muted">Connectez-vous pour accéder au tableau de bord</p>
        </div>
        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-medium">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Identifiants par défaut: admin / admin</small>
        </div>
    </div>
</div>
{% endblock %}
