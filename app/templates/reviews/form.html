{% extends "base.html" %}
{% block title %}{{ 'Modifier' if review else 'Ajouter' }} une revue - Sentinelle{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-person-check me-2"></i>{{ 'Modifier' if review else 'Ajouter' }} une revue de droits</h4>
    <a href="{{ url_for('reviews.list') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Retour</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="data-card p-4">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Application métier *</label>
                        <input type="text" name="application" class="form-control" required
                               value="{{ review.application if review else '' }}" placeholder="ex: SIRH, Finances, GED...">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Responsable</label>
                        <input type="text" name="responsible" class="form-control"
                               value="{{ review.responsible if review and review.responsible else '' }}" placeholder="Propriétaire / valideur">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Périmètre / notes</label>
                    <textarea name="scope" class="form-control" rows="3"
                              placeholder="Comptes concernés, profils, points à vérifier...">{{ review.scope if review and review.scope else '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-medium">Fréquence (jours)</label>
                        <input type="number" name="frequency_days" class="form-control"
                               value="{{ review.frequency_days if review else 365 }}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-medium">Dernière revue</label>
                        <input type="date" name="last_review" class="form-control"
                               value="{{ review.last_review.strftime('%Y-%m-%d') if review and review.last_review else '' }}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-medium">Prochaine revue</label>
                        <input type="date" name="next_review" class="form-control"
                               value="{{ review.next_review.strftime('%Y-%m-%d') if review and review.next_review else '' }}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-medium">Priorité</label>
                        <select name="priority" class="form-select">
                            <option value="low" {{ 'selected' if review and review.priority == 'low' }}>Basse</option>
                            <option value="medium" {{ 'selected' if not review or review.priority == 'medium' }}>Moyenne</option>
                            <option value="high" {{ 'selected' if review and review.priority == 'high' }}>Haute</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> {{ 'Enregistrer' if review else 'Ajouter' }}</button>
                    <a href="{{ url_for('reviews.list') }}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
