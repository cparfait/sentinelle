{# Barre CSV (export / import / modele). Variable attendue : csv_key #}
<div class="dropdown d-inline-block">
    <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-filetype-csv me-1"></i> CSV
    </button>
    <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 280px;">
        <a class="btn btn-sm btn-outline-primary w-100 mb-2" href="{{ url_for('data_io.export', key=csv_key) }}">
            <i class="bi bi-download me-1"></i> Exporter
        </a>
        {% if current_user.can_edit(csv_key) %}
        <hr class="my-2">
        <form method="POST" action="{{ url_for('data_io.import_csv', key=csv_key) }}" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label small mb-1 fw-medium">Importer un fichier CSV</label>
            <input type="file" name="file" accept=".csv,text/csv" class="form-control form-control-sm mb-2" required>
            <button type="submit" class="btn btn-sm btn-primary w-100">
                <i class="bi bi-upload me-1"></i> Importer
            </button>
        </form>
        <a class="small d-block mt-2 text-muted" href="{{ url_for('data_io.template', key=csv_key) }}">
            <i class="bi bi-file-earmark-arrow-down me-1"></i> Télécharger le modèle d'import
        </a>
        {% endif %}
    </div>
</div>
