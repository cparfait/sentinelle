{# Barre de recherche d'une liste. Variable optionnelle : q. Soumet en GET sur la page courante. #}
<form method="GET" class="mb-3">
    <div class="input-group input-group-sm" style="max-width: 380px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" name="q" value="{{ q or '' }}" class="form-control"
               placeholder="Rechercher dans la liste...">
        <button class="btn btn-primary" type="submit">Rechercher</button>
        {% if q %}<a href="{{ url_for(request.endpoint) }}" class="btn btn-outline-secondary" title="Effacer"><i class="bi bi-x-lg"></i></a>{% endif %}
    </div>
</form>
