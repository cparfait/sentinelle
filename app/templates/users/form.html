{% extends "base.html" %}
{% block title %}{{ 'Modifier' if user else 'Nouvel' }} utilisateur - Sentinelle{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>{{ 'Modifier' if user else 'Nouvel' }} utilisateur</h4>
    </div>
    <a href="{{ url_for('users.list') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Retour
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="data-card p-4">
            <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-medium">Nom d'utilisateur</label>
                    {% if user %}
                    <input type="text" class="form-control" value="{{ user.username }}" disabled>
                    {% else %}
                    <input type="text" name="username" class="form-control" required
                           placeholder="Nom d'utilisateur">
                    {% endif %}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email *</label>
                    <input type="email" name="email" class="form-control" required
                           value="{{ user.email if user else '' }}"
                           placeholder="email@domaine.com">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Mot de passe {{ '(laisser vide pour ne pas changer)' if user else '*' }}</label>
                    <input type="password" name="password" class="form-control"
                           {{ '' if user else 'required' }}
                           minlength="8"
                           placeholder="Minimum 8 caracteres">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Role *</label>
                    <select name="role" class="form-select" required>
                        <option value="viewer" {{ 'selected' if user and user.role == 'viewer' }}>Lecteur</option>
                        <option value="editor" {{ 'selected' if user and user.role == 'editor' }}>Editeur</option>
                        <option value="admin" {{ 'selected' if user and user.role == 'admin' }}>Administrateur</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> {{ 'Enregistrer' if user else 'Creer' }}
                    </button>
                    <a href="{{ url_for('users.list') }}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
