{% extends "base.html" %}
{% block title %}{{ 'Modifier' if update else 'Ajouter' }} une mise à jour - Sentinelle{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-arrow-up-circle me-2"></i>{{ 'Modifier' if update else 'Ajouter' }} — Mises à jour</h4>
    <a href="{{ url_for('updates.list') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Retour</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="data-card p-4">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-medium">Nom *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ update.name if update else '' }}" placeholder="ex: Windows Server 2022, Nginx, GLPI...">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Type</label>
                        <select name="system_type" class="form-select">
                            {% for val, lbl in type_choices %}
                            <option value="{{ val }}" {{ 'selected' if update and update.system_type == val }}>{{ lbl }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Version actuelle</label>
                        <input type="text" name="current_version" class="form-control"
                               value="{{ update.current_version if update and update.current_version else '' }}" placeholder="ex: 1.2.3">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Dernière version disponible</label>
                        <input type="text" name="latest_version" class="form-control"
                               value="{{ update.latest_version if update and update.latest_version else '' }}" placeholder="ex: 1.3.0">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Dernière mise à jour</label>
                        <input type="date" name="last_update" class="form-control"
                               value="{{ update.last_update.strftime('%Y-%m-%d') if update and update.last_update else '' }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Statut *</label>
                        <select name="status" class="form-select">
                            {% for val, lbl in status_choices %}
                            <option value="{{ val }}" {{ 'selected' if update and update.status == val }}>{{ lbl }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Priorité</label>
                        <select name="priority" class="form-select">
                            <option value="low" {{ 'selected' if update and update.priority == 'low' }}>Basse</option>
                            <option value="medium" {{ 'selected' if not update or update.priority == 'medium' }}>Moyenne</option>
                            <option value="high" {{ 'selected' if update and update.priority == 'high' }}>Haute</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Description / notes</label>
                    <textarea name="description" class="form-control" rows="3"
                              placeholder="Notes de version, criticité, dépendances...">{{ update.description if update and update.description else '' }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> {{ 'Enregistrer' if update else 'Ajouter' }}</button>
                    <a href="{{ url_for('updates.list') }}" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
